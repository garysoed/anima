name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anima
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: anima

      - name: Checkout devbase
        uses: actions/checkout@v4
        with:
          repository: garysoed/devbase
          token: ${{ secrets.DEPENDENCIES_TOKEN }}
          path: devbase

      - name: Checkout tools (gs-tools)
        uses: actions/checkout@v4
        with:
          repository: garysoed/tools
          token: ${{ secrets.DEPENDENCIES_TOKEN }}
          path: tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure workspace & install dependencies
        working-directory: .
        run: |
          echo '{"private": true, "workspaces": ["anima", "devbase", "tools"]}' > package.json
          npm install

      - name: Type check
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Build Demo
        run: npm run build:demo

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'anima/dist/demo'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
